name: SpendLog
options:
  bundleIdPrefix: com.spendlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  SpendLog:
    type: application
    platform: iOS
    sources:
      - SpendLog
      - Shared
    dependencies:
      - target: SpendLogWidget
    entitlements:
      path: SpendLog/SpendLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.spendlog.app
    info:
      path: SpendLog/Info.plist
      properties:
        CFBundleDisplayName: Spend Log
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Spend Log uses Face ID to keep your spending private when app lock is on.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ALTAppGroups:
          - group.com.spendlog.app
        CFBundleURLTypes:
          - CFBundleURLName: com.spendlog.app
            CFBundleURLSchemes:
              - spendlog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spendlog.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  SpendLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Widget/SpendLogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.spendlog.app
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Spend Log
        ALTAppGroups:
          - group.com.spendlog.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spendlog.app.widget
        TARGETED_DEVICE_FAMILY: "1"
