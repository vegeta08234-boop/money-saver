plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spendlog.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.spendlog.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    // One fixed key for every build, so a new version installs over the old one and keeps its data.
    signingConfigs {
        shared {
            storeFile file('spendlog.keystore')
            storePassword 'spendlog123'
            keyAlias 'spendlog'
            keyPassword 'spendlog123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
